mutation UpdateItemInShoppingCart($site: SiteEnum!, $shoppingCartItemId: ID!, $quantity: Int!) {
  updateItemInShoppingCart(
    site: $site
    shoppingCartItemId: $shoppingCartItemId
    quantity: $quantity
  ) {
    __typename
    ... on ShoppingCart {
      ...ShoppingCartFields
    }
    ... on ShoppingCartItemNotFound {
      code
    }
    ... on ShoppingCartNotFound {
      code
    }
  }
}
