mutation AddItemToShoppingCartLight($site: SiteEnum!, $input: ItemToShoppingCartInput!) {
  addItemToShoppingCart(site: $site, input: $input) {
    __typename
    ... on ShoppingCart {
      ...ShoppingCartSummaryFields
    }
    ... on ProductNotFound {
      code
    }
    ... on ShoppingCartNotFound {
      code
    }
  }
}
