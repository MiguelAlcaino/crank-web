fragment ProductFields on SellableProductInterface {
    __typename
    id
    title
    subtitle
    currency
    buttonText
    isVisible
    alertBeforePurchasing {
        title
        description
    }
    variants {
        id
        name
        price
        position
    }
    ... on ClassPackageProduct {
        type
    }
    ... on GiftCard {
        purchaseUrl
    }
}
