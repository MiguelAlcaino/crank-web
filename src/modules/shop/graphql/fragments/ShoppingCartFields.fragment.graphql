# Define a reusable fragment for the ShoppingCart fields.
# This avoids repetition if other queries/mutations also return a cart.
fragment ShoppingCartFields on ShoppingCart {
  id
  total
  subTotal
  currency
  giftCardCode
  discountCode
  items {
    id
    quantity
    subtotal
    variant {
      id
      name
      price
      product {
        ...ProductBasicFields
      }
    }
  }
}
